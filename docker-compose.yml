services:
  freebuff2api:
    build: .
    image: freebuff2api:1.7.0
    container_name: freebuff2api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./credentials:/app/credentials:ro
    ports:
      - "8787:8787"
    networks:
      - homelabs

networks:
  homelabs:
    external: true
