name: Get Freebuff authToken

# Manual trigger only (Actions page → Run workflow)
on:
  workflow_dispatch:
    inputs:
      poll_timeout:
        description: "Authorization wait time in seconds (default 300, gives time to authorize on phone)"
        required: false
        default: "300"
        type: string
      fingerprint:
        description: "Specify fingerprintId (leave blank for auto-generation)"
        required: false
        default: ""
        type: string

permissions:
  actions: write
  contents: write

jobs:
  oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # Force-check TG variables: skip if not configured
      - name: Validate TG variables (skip if not configured)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -u
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "❌ TG_BOT_TOKEN or TG_CHAT_ID not configured, workflow will not run."
            echo "    Configure these secrets in repo Settings → Secrets and variables → Actions:"
            echo "     - TG_BOT_TOKEN: Telegram Bot token"
            echo "     - TG_CHAT_ID  : Chat ID to receive messages"
            exit 1
          fi
          echo "✅ TG variables configured, continuing."

      - name: Checkout code
        uses: actions/checkout@v4

      # Send a test message first to confirm TG connectivity; if not received, bot/chat_id is misconfigured
      - name: Test TG connectivity (send test message)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          cd freebuff_tools
          python3 extract_freebuff.py tgsend

      - name: Run extraction script (auth link and authToken pushed to TG)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          OAUTH_POLL_TIMEOUT: ${{ inputs.poll_timeout }}
          FINGERPRINT: ${{ inputs.fingerprint }}
        run: |
          cd freebuff_tools
          if [ -n "$FINGERPRINT" ]; then
            python3 -u extract_freebuff.py login --fingerprint "$FINGERPRINT"
          else
            python3 -u extract_freebuff.py login
          fi

      # Clean up old run jobs: keep only the latest 1 run record
      - name: clear old run jobs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "deleted: $run_id"
              gh run delete $run_id || true
            fi
          done
